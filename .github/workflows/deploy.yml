name: CI/CD & Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Tools with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Unit Tests
        run: pnpm test

      - name: Build Static Bundle
        run: pnpm build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2b6f68023737 # v4.4.3
        with:
          name: dist-artifact
          path: dist

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Tools with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Download Build Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00dd00097743063f4e63 # v4.1.8
        with:
          name: dist-artifact
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@f868c2262d04a60037a3c3e29f52f5348873130d # v1.5.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'shimizu-thermodynamics-support-app'
          directory: 'dist'
          gitToPageslinking: false
